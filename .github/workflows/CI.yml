name: CI

on:
  push:
    branches-ignore: [gh-pages]  # metrics commits to gh-pages must not re-trigger CI
  pull_request:
  workflow_dispatch:

# github-action-benchmark pushes the metrics history to the gh-pages branch.
permissions:
  contents: write
  deployments: write

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: Build & test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # vcpkg_triplet: the triplet vcpkg.pri links against on that runner
          # Linux is pinned: the AppImages run only where glibc and libstdc++ are at least as new as the build machine's
          - os: windows-latest
            vcpkg_triplet: x64-windows-static-md
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
            vcpkg_triplet: x64-linux
          - os: ubuntu-24.04-arm
            qt_arch: linux_gcc_arm64
            vcpkg_triplet: arm64-linux
          - os: macos-latest
            qt_arch: clang_64
            vcpkg_triplet: arm64-osx

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        token: ${{ secrets.magic_pat }}

    - name: LOC count - Darkroom
      if: "startsWith(matrix.os, 'windows')"
      shell: pwsh
      run: |
        winget install --id AlDanial.Cloc --exact --silent --accept-package-agreements --accept-source-agreements
        "$env:LOCALAPPDATA\Microsoft\WinGet\Links" >> $env:GITHUB_PATH

        $result = cloc --include-lang="C,C++,C/C++ Header" --strip-str-comments --exclude-dir=tests,bin,build,.git,3rdparty --by-file --json --quiet ./Darkroom/ ./Shared/ | ConvertFrom-Json

        $loc = $result.SUM.code
        "Darkroom C/C++ code: $loc LOC"
        "LOC_DARKROOM=$loc" >> $env:GITHUB_ENV

        # Per-file counts (everything except the 'header' and 'SUM' meta entries)
        $result.PSObject.Properties |
          Where-Object { $_.Name -notin 'header','SUM' } |
          Sort-Object { $_.Value.code } -Descending |
          ForEach-Object { "{0,6}  {1}" -f $_.Value.code, $_.Name }

    # Quickroom's own sources only; Shared is counted once, under Darkroom.
    - name: LOC count - Quickroom
      if: "startsWith(matrix.os, 'windows')"
      shell: pwsh
      run: |
        $loc = (cloc --include-lang="C,C++,C/C++ Header" --strip-str-comments --exclude-dir=tests,bin,build,.git,3rdparty --json --quiet ./Quickroom/ | ConvertFrom-Json).SUM.code
        "Quickroom C/C++ code: $loc LOC"
        "LOC_QUICKROOM=$loc" >> $env:GITHUB_ENV

    - name: LOC count - libs
      if: "startsWith(matrix.os, 'windows')"
      shell: pwsh
      run: |
        $loc = (cloc --include-lang="C,C++,C/C++ Header" --strip-str-comments --exclude-dir=tests,bin,build,.git,3rdparty,Darkroom,Quickroom,Shared --json --quiet . | ConvertFrom-Json).SUM.code
        "Libs C/C++ code: $loc LOC"
        "LOC_LIBS=$loc" >> $env:GITHUB_ENV

    - name: Install Qt (macOS and Linux)
      if: ${{ !startsWith(matrix.os, 'windows') }}
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.12.*
        target: desktop
        arch: ${{ matrix.qt_arch }}
        # Linux only, for the AppImages:
        #   qtwayland - the Wayland window decorations; the Wayland client itself is in qtbase
        #   qtdeclarative - Qt Quick, which the FFmpeg multimedia plugin links on Linux
        archives: ${{ startsWith(matrix.os, 'ubuntu') && 'qtbase icu qtsvg qtwayland qtdeclarative' || 'qtbase icu qtsvg' }}
        modules: 'qtimageformats qtmultimedia'
        cache: 'true'

    # The trimmed kit released by VioletGiraffe/qt-for-win
    - name: Install Qt (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP 'qt.7z'
        Invoke-WebRequest 'https://github.com/VioletGiraffe/qt-for-win/releases/download/6.12.1/qt-6.12.1-msvc2022_64.7z' -OutFile $archive
        7z x $archive "-o$env:RUNNER_TEMP\Qt" | Out-Null
        if ($LASTEXITCODE) { throw "7z failed with exit code $LASTEXITCODE" }
        "QT_ROOT_DIR=$env:RUNNER_TEMP\Qt" >> $env:GITHUB_ENV
        "$env:RUNNER_TEMP\Qt\bin" >> $env:GITHUB_PATH

    - name: Windows - set up MSVC environment
      if: startsWith(matrix.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Linux - install toolchain
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update -y; sudo apt install -qq gcc-14 g++-14 libgl1-mesa-dev nasm
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 50
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 50
        g++ --version

    # LibRaw's OpenMP runtime: vcpkg-triplets/arm64-osx.cmake and vcpkg.pri point at it
    - name: macOS - install libomp
      if: startsWith(matrix.os, 'macos')
      run: brew install libomp

    # Expressions cannot read the runner's own environment variables
    - name: Read runner image version
      id: runner_image
      shell: pwsh
      run: |
        "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

    # vcpkg's built packages, so a run rebuilds only what vcpkg.json, the triplets or the runner image changed.
    # The image is part of every key: vcpkg's package ABIs hash its compiler, CMake and PowerShell, so another image's packages never match.
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner_image.outputs.version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}
        restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner_image.outputs.version }}-

    # After the MSVC environment, which can point VCPKG_ROOT at Visual Studio's own vcpkg
    - name: Set up vcpkg at the manifest's baseline
      shell: pwsh
      run: |
        $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        git clone --quiet https://github.com/microsoft/vcpkg $vcpkgRoot
        git -C $vcpkgRoot checkout --quiet $baseline
        $bootstrap = if ($IsWindows) { 'bootstrap-vcpkg.bat' } else { 'bootstrap-vcpkg.sh' }
        & (Join-Path $vcpkgRoot $bootstrap) -disableMetrics
        if ($LASTEXITCODE -ne 0) { exit 1 }

        $binaryCache = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache')
        "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        "VCPKG_BINARY_SOURCES=clear;files,$($binaryCache.FullName),readwrite" >> $env:GITHUB_ENV

    # The scripts' own install then finds everything installed
    - name: Install vcpkg packages
      shell: pwsh
      run: |
        & (Join-Path $env:VCPKG_ROOT 'vcpkg') install --triplet ${{ matrix.vcpkg_triplet }}
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Build tests (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: scripts\run_tests.bat -BuildOnly -PlatformToolset v145

    - name: Run tests (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: scripts\run_tests.bat -NoBuild

    - name: Build tests (Unix)
      if: ${{ !startsWith(matrix.os, 'windows') }}
      run: ./scripts/run_tests.sh build

    - name: Run tests (Unix)
      if: ${{ !startsWith(matrix.os, 'windows') }}
      run: ./scripts/run_tests.sh nobuild

    - name: Build app (Windows)
      id: build_app_windows
      if: ${{ !cancelled() && startsWith(matrix.os, 'windows') }}
      shell: cmd
      run: scripts\build.bat -PlatformToolset v145

    # Keyed on the app build alone: packaging is still checked when the tests failed.
    - name: Build installer (Windows)
      id: build_installer_windows
      if: ${{ !cancelled() && steps.build_app_windows.outcome == 'success' }}
      shell: cmd
      run: |
        @echo on
        set STAGING_DIR=dist
        RMDIR /S /Q %STAGING_DIR%
        mkdir %STAGING_DIR%
        copy /y bin\release\Darkroom.exe "%STAGING_DIR%\" >nul
        copy /y bin\release\Quickroom.exe "%STAGING_DIR%\" >nul
        FOR %%p IN (%STAGING_DIR%\*.exe) DO %QT_ROOT_DIR%\bin\windeployqt.exe --dir %STAGING_DIR% --force --release --no-translations --no-system-d3d-compiler --no-system-dxc-compiler --no-opengl-sw --skip-plugin-types networkinformation,tls %%p

        del  %STAGING_DIR%\dxil.dll >nul
        del  %STAGING_DIR%\dxcompiler.dll >nul

        "%programfiles(x86)%\Inno Setup 6\iscc" installer.iss

    # The deployed set alone: the Qt install's directories would hide what the deployment left out
    - name: Test run (Windows)
      if: ${{ !cancelled() && steps.build_installer_windows.outcome == 'success' }}
      shell: pwsh
      run: |
        Remove-Item Env:QT_PLUGIN_PATH -ErrorAction Ignore
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'Qt6Core.dll')) }) -join ';'
        $failed = $false
        foreach ($app in 'Darkroom', 'Quickroom') {
          # A GUI executable started directly would not be waited for
          $out = Join-Path $env:RUNNER_TEMP "$app-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "$app-err.txt"
          $process = Start-Process "dist\$app.exe" -ArgumentList '--test-run' -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err
          "${app}: exit code $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { $failed = $true }
        }
        if ($failed) { exit 1 }

    - name: Build app (Unix)
      id: build_app_unix
      if: ${{ !cancelled() && !startsWith(matrix.os, 'windows') }}
      run: ./scripts/build.sh

    - name: Build .dmg (macOS)
      id: build_dmg
      if: ${{ !cancelled() && steps.build_app_unix.outcome == 'success' && startsWith(matrix.os, 'macos') }}
      run: ./scripts/create_dmg.sh $QT_ROOT_DIR

    # The bundles create_dmg.sh deployed, without the Qt install's plugins to hide what the deployment left out
    - name: Test run (macOS)
      if: ${{ !cancelled() && steps.build_dmg.outcome == 'success' }}
      run: |
        unset QT_PLUGIN_PATH
        status=0
        for app in Darkroom Quickroom; do
          "bin/release/$app.app/Contents/MacOS/$app" --test-run || status=1
        done
        exit $status

    # linuxdeploy copies the libraries the platform plugins link from this machine
    - name: Build AppImages (Linux)
      id: build_appimages
      if: ${{ !cancelled() && steps.build_app_unix.outcome == 'success' && startsWith(matrix.os, 'ubuntu') }}
      run: |
        sudo apt install -qq libwayland-client0 libwayland-cursor0 libxkbcommon0 libxcb-cursor0
        ./scripts/create_appimage.sh $QT_ROOT_DIR

    # The Qt install's paths would hide libraries and plugins missing from the AppImages. The runners have no FUSE to mount them.
    - name: Test run (Linux)
      if: ${{ !cancelled() && steps.build_appimages.outcome == 'success' }}
      run: |
        sudo apt install -qq xvfb
        unset LD_LIBRARY_PATH QT_PLUGIN_PATH
        status=0
        for appimage in Darkroom-*.AppImage Quickroom-*.AppImage; do
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum "./$appimage" --test-run || status=1
        done
        exit $status

    - name: Binary sizes - Windows
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        # Per-PE-section on-disk sizes from the "size of raw data" field of each SECTION HEADER.
        # dumpbin is on PATH via the earlier MSVC dev-cmd step.
        function Get-PeSectionSizes([string] $path) {
          $name = $null
          $sections = @()
          foreach ($line in (dumpbin /headers $path)) {
            if     ($line -match '^\s+(\S+) name$')                                 { $name = $Matches[1] }
            elseif ($line -match '^\s+([0-9A-Fa-f]+) size of raw data$' -and $name) {
              $sections += [pscustomobject]@{ Name = $name; KB = [math]::Round([Convert]::ToInt64($Matches[1], 16) / 1KB, 2) }
              $name = $null
            }
          }
          $sections | Sort-Object KB -Descending
        }

        $darkroom  = Get-Item "bin\release\Darkroom.exe"
        $quickroom = Get-Item "bin\release\Quickroom.exe"

        $sectionsByExe = @{}
        foreach ($b in $darkroom, $quickroom) {
          "{0,10:N2} KB  {1}" -f ($b.Length / 1KB), $b.Name
          $sectionsByExe[$b.Name] = Get-PeSectionSizes $b.FullName
          $sectionsByExe[$b.Name] | Format-Table Name, KB -AutoSize
        }

        "EXE_KB=$([math]::Round($darkroom.Length / 1KB, 2))" >> $env:GITHUB_ENV
        "QUICKROOM_KB=$([math]::Round($quickroom.Length / 1KB, 2))" >> $env:GITHUB_ENV
        # Per-section charts cover the main executable only.
        "SECTIONS_JSON=$($sectionsByExe[$darkroom.Name] | ConvertTo-Json -Compress -AsArray)" >> $env:GITHUB_ENV

    - name: Binary sizes - Mac
      if: startsWith(matrix.os, 'macos')
      run: |
        cd bin/release
        for f in Darkroom.app/Contents/MacOS/Darkroom Quickroom.app/Contents/MacOS/Quickroom; do
          awk -v b="$(wc -c < "$f")" -v n="$f" 'BEGIN { printf "%10.2f KB  %s\n", b/1024, n }'
        done

    # Record LOC, exe size + per-section sizes to the gh-pages history and regenerate the chart.
    # Only on pushes to main so PRs/forks don't write history (and forks lack a write token).
    - name: Assemble metrics data
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        $data = @(
          @{ name = 'Lines of code (Darkroom)';  unit = 'LOC'; value = [int]$env:LOC_DARKROOM }
          @{ name = 'Lines of code (Quickroom)'; unit = 'LOC'; value = [int]$env:LOC_QUICKROOM }
          @{ name = 'Lines of code (libs)';      unit = 'LOC'; value = [int]$env:LOC_LIBS }
          @{ name = 'Darkroom.exe size';         unit = 'KB';  value = [double]$env:EXE_KB }
          @{ name = 'Quickroom.exe size';        unit = 'KB';  value = [double]$env:QUICKROOM_KB }
        )

        # Darkroom.exe's PE sections, measured by the earlier size step. Each becomes its own chart; .msvcjmc is skipped.
        foreach ($s in ($env:SECTIONS_JSON | ConvertFrom-Json) | Where-Object Name -ne '.msvcjmc') {
          $data += @{ name = "Section $($s.Name)"; unit = 'KB'; value = $s.KB }
        }

        $data | ConvertTo-Json -AsArray | Out-File -FilePath metrics.json -Encoding utf8
        Get-Content metrics.json

    - name: Update metrics history & chart (gh-pages)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(matrix.os, 'windows')
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Darkroom metrics
        tool: customSmallerIsBetter
        output-file-path: metrics.json
        benchmark-data-dir-path: dev/metrics  # where data.js + index.html live on gh-pages (default: dev/bench)
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # Don't treat a change as a regression
        comment-on-alert: false
        fail-on-alert: false

    - name: Upload Installer
      if: success() && startsWith(matrix.os, 'windows')
      uses: actions/upload-artifact@v7
      with:
        path: Darkroom.exe
        archive: false

    - name: Upload .dmg
      if: success() && startsWith(matrix.os, 'macos')
      uses: actions/upload-artifact@v7
      with:
        path: Darkroom.dmg
        archive: false

    # One upload per file: an unarchived artifact holds a single file
    - name: Upload Darkroom AppImage
      if: success() && startsWith(matrix.os, 'ubuntu')
      uses: actions/upload-artifact@v7
      with:
        path: Darkroom-*.AppImage
        archive: false

    - name: Upload Quickroom AppImage
      if: success() && startsWith(matrix.os, 'ubuntu')
      uses: actions/upload-artifact@v7
      with:
        path: Quickroom-*.AppImage
        archive: false